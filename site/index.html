<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071117">
    <meta name="description" content="Daily bird capture and mist forecasts for the Ngulia ringing season.">
    <title>Live forecast | Ngulia</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Ngulia forecast home">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span><strong>Ngulia</strong><small>forecast</small></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a id="nav-live" href="./">Live</a>
        <a id="nav-explore" href="explore/">Explore</a>
        <a href="count/">Count model</a>
        <a href="mist/">Mist model</a>
      </nav>
      <div class="update-state"><span class="pulse" aria-hidden="true"></span><span id="update-label">Loading…</span></div>
    </header>

    <main>
      <section class="live-section" aria-labelledby="live-title" aria-live="polite">
        <div class="live-cards">
          <article class="today-card">
            <div class="section-kicker">
              <h1 id="live-title">Today</h1>
            </div>
            <p class="live-date" id="primary-date">Tonight</p>
            <div class="catch-reading">
              <span class="catch-value" id="primary-catch">—</span>
              <span class="catch-unit">birds expected</span>
            </div>
            <p class="catch-range" id="catch-range">Loading uncertainty range…</p>
            <p class="catch-context" id="catch-context"></p>
          </article>

          <article class="signal moon-signal">
            <span class="signal-label">Moon</span>
            <span class="moon-icon" id="moon-icon" aria-hidden="true">●</span>
            <strong id="moon-phase">—</strong>
          </article>
          <article class="signal mist-signal">
            <span class="signal-label">Mist probability</span>
            <div class="mist-meter" aria-hidden="true">
              <div class="mist-reading"><strong id="mist-value">—</strong><span>%</span></div>
            </div>
          </article>
        </div>

        <details class="weather-details">
          <summary>Weather details</summary>
          <div class="weather-grid" id="weather-grid"></div>
        </details>
      </section>

      <section class="next-section" aria-labelledby="next-title">
        <div class="section-heading">
          <h2 id="next-title">Next days</h2>
        </div>
        <div id="next-days" class="next-days"></div>
      </section>

      <section class="season-section" aria-labelledby="season-title">
        <div class="section-heading">
          <h2 id="season-title">Entire season</h2>
        </div>
        <div class="season-legend">
          <span><i class="line-live"></i> Weather forecast</span>
          <span><i class="line-baseline"></i> Typical weather</span>
        </div>
        <div id="season-chart" class="season-chart"></div>
      </section>
    </main>

    <footer>
      <span>Ngulia ringing project</span>
      <a class="github-link" href="https://github.com/A-Rocha-Kenya/ngulia-forcast" aria-label="Ngulia forecast repository on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>GitHub</span>
      </a>
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
