<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071117">
    <meta name="description" content="Daily predicted catch for the Ngulia ringing season.">
    <title>Ngulia catch forecast</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Ngulia catch forecast home">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span><strong>Ngulia</strong><small>catch forecast</small></span>
      </a>
      <div class="update-state"><span class="pulse" aria-hidden="true"></span><span id="update-label">Loading…</span></div>
    </header>

    <main>
      <section class="live-section" aria-labelledby="live-title" aria-live="polite">
        <div class="live-cards">
          <article class="today-card">
            <div class="section-kicker">
              <h1 id="live-title">Today</h1>
            </div>
            <p class="live-date" id="primary-date">Tonight</p>
            <div class="catch-reading">
              <span class="catch-value" id="primary-catch">—</span>
              <span class="catch-unit">birds expected</span>
            </div>
            <p class="catch-range" id="catch-range">Loading uncertainty range…</p>
            <p class="catch-context" id="catch-context"></p>
          </article>

          <article class="signal moon-signal">
            <span class="signal-label">Moon</span>
            <span class="moon-icon" id="moon-icon" aria-hidden="true">●</span>
            <strong id="moon-phase">—</strong>
          </article>
          <article class="signal mist-signal">
            <span class="signal-label">Mist probability</span>
            <div class="mist-meter" aria-hidden="true">
              <div class="mist-reading"><strong id="mist-value">—</strong><span>%</span></div>
            </div>
          </article>
        </div>

        <details class="weather-details">
          <summary>Weather details</summary>
          <div class="weather-grid" id="weather-grid"></div>
        </details>
      </section>

      <section class="next-section" aria-labelledby="next-title">
        <div class="section-heading">
          <h2 id="next-title">Next days</h2>
        </div>
        <div id="next-days" class="next-days"></div>
      </section>

      <section class="season-section" aria-labelledby="season-title">
        <div class="section-heading">
          <h2 id="season-title">Entire season</h2>
        </div>
        <div class="season-legend">
          <span><i class="line-live"></i> Weather forecast</span>
          <span><i class="line-baseline"></i> Typical weather</span>
        </div>
        <div id="season-chart" class="season-chart"></div>
      </section>
    </main>

    <footer>
      <span>Catch assumes ringing at front bush · 80% model range</span>
      <span class="footer-links"><a href="?demo=1">Demo</a><a href="count/model.html">Count report</a><a href="mist/model.html">Mist report</a><a href="https://github.com/A-Rocha-Kenya/ngulia-forcast">Method</a></span>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
